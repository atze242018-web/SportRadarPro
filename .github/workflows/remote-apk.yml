name: SportRadar Mobil APK
on:
  push:
    branches: [mobile-remote-v1]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Kopplung mit Herkunftsschutz testen
        run: |
          mkdir -p /tmp/pairing-test
          javac -d /tmp/pairing-test remote/src/main/java/de/biendorf/sportradar/remote/PairingClient.java tests/mobile/PairingTest.java
          java -Dsun.net.http.allowRestrictedHeaders=true -cp /tmp/pairing-test PairingTest
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle --no-daemon :remote:assembleRelease :remote:lintRelease
      - run: |
          mkdir deliver
          cp remote/build/outputs/apk/release/remote-release-unsigned.apk deliver/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" deliver/
      - uses: actions/upload-artifact@v4
        with:
          name: SportRadar-Mobil-build
          path: deliver/
          retention-days: 7
