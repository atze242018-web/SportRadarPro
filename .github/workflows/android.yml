name: Android APK bauen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sport- und Demokonto-Tests
        run: node --test tests/*.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android-Werkzeuge einrichten
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12266719'
      - name: Android SDK bereitstellen
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Installierbare Test-APK bauen
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SportRadarPro-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-Pruefbericht
          path: app/build/reports/
          if-no-files-found: ignore
