plugins { id 'com.android.application' }
android {
    namespace 'de.biendorf.sportradar'
    compileSdk 35
    defaultConfig {
        applicationId 'de.biendorf.sportradar'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.4.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1'; implementation 'com.google.mlkit:text-recognition:16.0.1' }
